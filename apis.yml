aid: firestorm
name: Firestorm
description: 'Firestorm (Firestorm Labs, Inc.) is a San Diego based defense technology
  company founded in 2022 that builds expeditionary manufacturing systems and modular
  unmanned aerial systems. Its xCELL containerized production unit uses HP Multi Jet
  Fusion additive manufacturing to 3D print industrial-grade PA-12 nylon composite
  airframes and spare parts at the tactical edge, feeding modular UAS platforms including
  the Tempest fixed-wing family and the Squall FPV drone. The company holds a five-year,
  $100M U.S. Air Force IDIQ and closed an $82M Series B in April 2026 led by Washington
  Harbour Partners. Firestorm ships hardware, not software: as of this profiling pass
  it publishes no developer portal, no public API, and no machine-readable API contract.'
